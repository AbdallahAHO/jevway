name: Bug report
description: A run did the wrong thing, or jevway failed to start or install.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A page that pushes a run past its limits (an unconfirmed irreversible click, leaving the allowed hosts, a secret in the output) is a security issue: please [report it privately](https://github.com/AbdallahAHO/jevway/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: The goal you gave, what the run did, and what it should have done.
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: The call
      description: The `jevway_task` arguments or the CLI command. Replace secret values with `…`.
      render: json
  - type: textarea
    id: summary
    attributes:
      label: The summary jevway returned
      description: At least `status`, `reason`, `story` and `url`; the full result (`detail` set to `"full"`, CLI `--detail full`) when the steps' confidences matter. Remove anything private from `page_text`.
      render: json
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx jevway doctor`
      description: It never prints your key.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: jevway version
      description: The output of `npx jevway --version`.
      placeholder: "npx jevway --version"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model (`JEVWAY_MODEL`)
      options: [jev (default), pplx-decider, clef-omni, clef, clef-flash, gpt-6-luna]
  - type: dropdown
    id: browser
    attributes:
      label: Browser (`JEVWAY_BROWSER`)
      options: [auto (default), launch, launch-headless, an explicit debugging port]
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code, Codex, Cursor, OpenCode, the CLI…
  - type: input
    id: site
    attributes:
      label: Site
      description: A public URL that reproduces it, if there is one.
