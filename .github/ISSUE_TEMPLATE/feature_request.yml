name: Feature request
description: Something jevway can't do yet, or a site it can't handle.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to get done
      description: The task, in your own words, and the site or kind of page.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: The status and reason jevway returns, or the workaround you use.
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: A new parameter, a status, a check, a supported control… Optional.
  - type: markdown
    attributes:
      value: |
        Some limits are deliberate: jevway never types text you didn't supply, never sees password fields, never gets past bot checks, and never turns model output into a selector or script. [docs/prior-art.md](https://github.com/AbdallahAHO/jevway/blob/main/docs/prior-art.md) lists ideas already planned or rejected.
