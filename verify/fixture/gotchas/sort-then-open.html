<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sessions</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  main { padding: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #ddd; }
  th.sortable { cursor: pointer; }
  #list tr { cursor: pointer; }
  #detail { margin-top: 12px; padding: 12px; border: 1px solid #aaa; }
</style>
</head>
<body>
<main>
  <h1>Sessions</h1>
  <table>
    <thead><tr><th>Session</th><th>User</th><th class="sortable" aria-sort="none">Total cost</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  <section id="detail" hidden></section>
</main>
<script>
  // chaos=1: churn the list every 900 ms, shift the layout every 1.3 s, delay click effects by 300-800 ms.
  const chaos = new URLSearchParams(location.search).get('chaos') === '1';
  const later = (effect) => (chaos ? setTimeout(effect, 300 + Math.random() * 500) : effect());
  if (chaos) {
    const container = document.getElementById('list');
    setInterval(() => container.replaceChildren(...container.cloneNode(true).childNodes), 900);
    const banner = document.createElement('div');
    banner.style.cssText = 'height:40px;background:#fe9;padding:12px;box-sizing:border-box';
    banner.textContent = 'New version available';
    setInterval(() => (banner.isConnected ? banner.remove() : document.body.prepend(banner)), 1300);
  }
  window.__fixture = { sort: 'none', opened: null };
  // session-07 is the most expensive.
  const sessions = [
    ['session-01', 'ada', 0.42], ['session-02', 'grace', 1.18], ['session-03', 'linus', 0.07],
    ['session-04', 'ada', 2.65], ['session-05', 'alan', 0.93], ['session-06', 'grace', 3.1],
    ['session-07', 'margaret', 7.84], ['session-08', 'linus', 1.77], ['session-09', 'alan', 0.35],
    ['session-10', 'ada', 5.21], ['session-11', 'margaret', 0.64], ['session-12', 'grace', 2.02],
  ];
  const header = document.querySelector('th.sortable');
  const next = { none: 'desc', desc: 'asc', asc: 'none' };
  const arrow = { none: '', desc: ' ▼', asc: ' ▲' };

  const showRows = () => {
    const { sort } = window.__fixture;
    const rows = sort === 'none' ? sessions : [...sessions].sort((a, b) => (sort === 'desc' ? b[2] - a[2] : a[2] - b[2]));
    document.getElementById('list').innerHTML = rows
      .map(([id, user, cost]) => `<tr data-id="${id}"><td>${id}</td><td>${user}</td><td>$${cost.toFixed(2)}</td></tr>`)
      .join('');
    header.textContent = `Total cost${arrow[sort]}`;
    header.setAttribute('aria-sort', { none: 'none', desc: 'descending', asc: 'ascending' }[sort]);
  };
  showRows();

  document.addEventListener('click', (event) => {
    if (event.target.closest('th.sortable')) {
      later(() => ((window.__fixture.sort = next[window.__fixture.sort]), showRows()));
    }
    const row = event.target.closest('#list tr');
    if (row) {
      const { id } = row.dataset;
      later(() => {
        document.getElementById('detail').hidden = false;
        document.getElementById('detail').textContent = `Session ${id}: total cost $${sessions.find(([key]) => key === id)[2].toFixed(2)}`;
        window.__fixture.opened = id;
      });
    }
  });
</script>
</body>
</html>
