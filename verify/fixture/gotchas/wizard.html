<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  main { padding: 16px; max-width: 480px; }
  label { display: block; margin: 12px 0; }
  button { padding: 6px 14px; }
  #error { color: #b00; }
</style>
</head>
<body>
<main>
  <h1>Setup wizard</h1>
  <div id="list">
    <section id="step1">
      <p>Step 1 of 2: terms</p>
      <label><input type="checkbox" id="agree"> I agree to the terms</label>
      <button type="button" id="next" disabled>Next</button>
    </section>
    <section id="step2" hidden>
      <p>Step 2 of 2: your name</p>
      <label>Name <input type="text" id="name"></label>
      <button type="button" id="finish">Finish</button>
      <p id="error"></p>
    </section>
  </div>
  <p id="done" hidden>Setup complete</p>
</main>
<script>
  // chaos=1: churn the list every 900 ms, shift the layout every 1.3 s, delay click effects by 300-800 ms.
  const chaos = new URLSearchParams(location.search).get('chaos') === '1';
  const later = (effect) => (chaos ? setTimeout(effect, 300 + Math.random() * 500) : effect());
  if (chaos) {
    const container = document.getElementById('list');
    setInterval(() => container.replaceChildren(...container.cloneNode(true).childNodes), 900);
    const banner = document.createElement('div');
    banner.style.cssText = 'height:40px;background:#fe9;padding:12px;box-sizing:border-box';
    banner.textContent = 'New version available';
    setInterval(() => (banner.isConnected ? banner.remove() : document.body.prepend(banner)), 1300);
  }
  window.__fixture = { agreed: false, step: 1, name: null, done: false };
  // Looks the controls up at call time: churn replaces the nodes a click was made on.
  const byId = (id) => document.getElementById(id);

  document.addEventListener('click', (event) => {
    if (event.target.id === 'agree') {
      const agreed = event.target.checked;
      later(() => {
        byId('next').disabled = !agreed;
        window.__fixture.agreed = agreed;
      });
    }
    if (event.target.id === 'next' && !event.target.disabled) {
      later(() => {
        byId('step1').hidden = true;
        byId('step2').hidden = false;
        window.__fixture.step = 2;
      });
    }
    if (event.target.id === 'finish') {
      later(() => {
        const name = byId('name').value.trim();
        byId('error').textContent = name ? '' : 'Name is required';
        if (!name) return;
        byId('list').hidden = true;
        byId('done').hidden = false;
        Object.assign(window.__fixture, { name, done: true });
      });
    }
  });
</script>
</body>
</html>
