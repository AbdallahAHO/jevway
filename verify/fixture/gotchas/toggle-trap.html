<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runs</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  main { padding: 16px; }
  .bar { display: flex; gap: 8px; margin-bottom: 12px; }
  /* The panel behind the Filters button has nothing in it. */
  #panel { min-height: 40px; margin-bottom: 12px; border: 1px dashed #bbb; }
  .chip { border-radius: 14px; padding: 4px 12px; border: 1px solid #999; background: #fff; }
  .chip[aria-pressed=true] { background: #dbeafe; border-color: #3b82f6; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
<main>
  <h1>Runs</h1>
  <div class="bar">
    <button type="button" id="filters" aria-expanded="false">Filters</button>
    <button type="button" class="chip" data-filter="success" aria-pressed="false">Status: success</button>
    <button type="button" class="chip" data-filter="failed" aria-pressed="false">Status: failed</button>
    <button type="button" class="chip" data-filter="running" aria-pressed="false">Status: running</button>
  </div>
  <div id="panel" hidden></div>
  <table>
    <thead><tr><th>Run</th><th>Status</th><th>Duration</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</main>
<script>
  // chaos=1: churn the list every 900 ms, shift the layout every 1.3 s, delay click effects by 300-800 ms.
  const chaos = new URLSearchParams(location.search).get('chaos') === '1';
  const later = (effect) => (chaos ? setTimeout(effect, 300 + Math.random() * 500) : effect());
  if (chaos) {
    const container = document.getElementById('list');
    setInterval(() => container.replaceChildren(...container.cloneNode(true).childNodes), 900);
    const banner = document.createElement('div');
    banner.style.cssText = 'height:40px;background:#fe9;padding:12px;box-sizing:border-box';
    banner.textContent = 'New version available';
    setInterval(() => (banner.isConnected ? banner.remove() : document.body.prepend(banner)), 1300);
  }
  window.__fixture = { filter: null, panelOpen: false };
  const runs = [
    ['run-001', 'success', '4m'], ['run-002', 'success', '6m'], ['run-003', 'failed', '1m'], ['run-004', 'running', '2m'],
    ['run-005', 'success', '5m'], ['run-006', 'failed', '9m'], ['run-007', 'success', '3m'], ['run-008', 'running', '1m'],
    ['run-009', 'failed', '7m'], ['run-010', 'success', '8m'],
  ];
  document.getElementById('list').innerHTML = runs
    .map(([id, status, duration]) => `<tr data-status="${status}"><td>${id}</td><td>${status}</td><td>${duration}</td></tr>`)
    .join('');

  // Clicking the chip that is already on clears the filter.
  const setFilter = (filter) => {
    window.__fixture.filter = filter;
    for (const row of document.querySelectorAll('#list tr')) row.hidden = filter !== null && row.dataset.status !== filter;
    for (const chip of document.querySelectorAll('.chip')) chip.setAttribute('aria-pressed', String(chip.dataset.filter === filter));
  };

  document.addEventListener('click', (event) => {
    if (event.target.id === 'filters') {
      later(() => {
        const open = document.getElementById('panel').hidden;
        document.getElementById('panel').hidden = !open;
        document.getElementById('filters').setAttribute('aria-expanded', String(open));
        window.__fixture.panelOpen = open;
      });
    }
    const chip = event.target.closest('.chip');
    if (chip) {
      const { filter } = chip.dataset;
      later(() => setFilter(window.__fixture.filter === filter ? null : filter));
    }
  });
</script>
</body>
</html>
