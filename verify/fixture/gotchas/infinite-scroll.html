<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feed</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  h1 { margin: 0; padding: 16px; }
  #list a { display: block; height: 44px; line-height: 44px; padding: 0 16px; border-bottom: 1px solid #eee; }
  #more { padding: 16px; color: #666; }
  #detail { padding: 16px; }
</style>
</head>
<body>
<h1>Feed</h1>
<div id="list"></div>
<div id="more" hidden>Loading more…</div>
<section id="detail" hidden></section>
<script>
  // chaos=1: churn the list every 900 ms, shift the layout every 1.3 s, delay click effects by 300-800 ms.
  const chaos = new URLSearchParams(location.search).get('chaos') === '1';
  const later = (effect) => (chaos ? setTimeout(effect, 300 + Math.random() * 500) : effect());
  if (chaos) {
    const container = document.getElementById('list');
    setInterval(() => container.replaceChildren(...container.cloneNode(true).childNodes), 900);
    const banner = document.createElement('div');
    banner.style.cssText = 'height:40px;background:#fe9;padding:12px;box-sizing:border-box';
    banner.textContent = 'New version available';
    setInterval(() => (banner.isConnected ? banner.remove() : document.body.prepend(banner)), 1300);
  }
  window.__fixture = { loads: 0, opened: null };
  const PAGE = 20;
  const MAX = 60;
  let count = 0;
  let loading = false;
  const append = () => {
    const items = Array.from({ length: PAGE }, (_, i) => `<a href="#" data-id="item-${count + i + 1}">Item ${count + i + 1}</a>`);
    document.getElementById('list').insertAdjacentHTML('beforeend', items.join(''));
    count += PAGE;
  };
  append();

  // Scrolling near the bottom fetches the next 20 after a short network delay.
  window.addEventListener('scroll', () => {
    const nearBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 300;
    if (loading || count >= MAX || !nearBottom) return;
    loading = true;
    document.getElementById('more').hidden = false;
    setTimeout(() => {
      append();
      window.__fixture.loads++;
      document.getElementById('more').hidden = true;
      loading = false;
    }, 300);
  });

  document.addEventListener('click', (event) => {
    const link = event.target.closest('a');
    if (!link) return;
    event.preventDefault();
    const { id } = link.dataset;
    later(() => {
      window.__fixture.opened = id ?? null;
      document.getElementById('list').hidden = Boolean(id);
      document.getElementById('detail').hidden = !id;
      document.getElementById('detail').innerHTML = id ? `<h2>${id.replace('-', ' ')} is open</h2><a href="#" data-back>Back to feed</a>` : '';
    });
  });
</script>
</body>
</html>
