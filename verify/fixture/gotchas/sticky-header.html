<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Items</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  /* A fixed site header that paints over whatever scrolls under it. */
  header { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 5; background: #222; color: #fff; padding: 12px 16px; box-sizing: border-box; }
  main { padding-top: 40px; }
  #list a { display: block; height: 44px; line-height: 44px; padding: 0 16px; border-bottom: 1px solid #eee; }
  #detail { padding: 16px; }
</style>
</head>
<body>
<header>Project items</header>
<main>
  <div id="list"></div>
  <section id="detail" hidden></section>
</main>
<script>
  // chaos=1: churn the list every 900 ms, shift the layout every 1.3 s, delay click effects by 300-800 ms.
  const chaos = new URLSearchParams(location.search).get('chaos') === '1';
  const later = (effect) => (chaos ? setTimeout(effect, 300 + Math.random() * 500) : effect());
  if (chaos) {
    const container = document.getElementById('list');
    setInterval(() => container.replaceChildren(...container.cloneNode(true).childNodes), 900);
    const banner = document.createElement('div');
    banner.style.cssText = 'height:40px;background:#fe9;padding:12px;box-sizing:border-box';
    banner.textContent = 'New version available';
    setInterval(() => (banner.isConnected ? banner.remove() : document.body.prepend(banner)), 1300);
  }
  window.__fixture = { opened: null };
  document.getElementById('list').innerHTML = Array.from({ length: 40 }, (_, i) => i + 1)
    .map((n) => `<a href="#" data-id="item-${n}">Item ${n}</a>`)
    .join('');
  const detail = document.getElementById('detail');

  document.addEventListener('click', (event) => {
    const link = event.target.closest('a');
    if (!link) return;
    event.preventDefault();
    const { id } = link.dataset;
    later(() => {
      window.__fixture.opened = id ?? null;
      document.getElementById('list').hidden = Boolean(id);
      detail.hidden = !id;
      detail.innerHTML = id ? `<h2>${id.replace('-', ' ')} is open</h2><a href="#" data-back>Back to items</a>` : '';
    });
  });
</script>
</body>
</html>
