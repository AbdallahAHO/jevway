<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contenteditable search</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  /* Like Langfuse's trace search: an editor div, not an input. */
  #search { width: 320px; min-height: 20px; padding: 6px 8px; border: 1px solid #999; }
</style>
</head>
<body>
<div id="search" role="combobox" contenteditable="true" aria-label="Search" aria-expanded="false"></div>
</body>
</html>
