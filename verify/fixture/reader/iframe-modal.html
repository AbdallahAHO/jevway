<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iframe under a modal</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  iframe { display: block; margin: 20px 0 0 120px; width: 360px; height: 200px; border: 3px solid #888; padding: 5px; }
  .modal { position: fixed; left: 200px; top: 90px; width: 260px; padding: 12px; background: #fff; border: 1px solid #444; }
  .banner { position: fixed; left: 0; right: 0; top: 0; height: 400px; background: #ffe; border-bottom: 1px solid #444; }
</style>
</head>
<body>
<p>Checkout</p>
<iframe src="frame-form.html" title="Coupon form"></iframe>
<div class="modal" role="dialog" aria-modal="true" aria-label="Notice">
  <p>Prices changed.</p>
  <button type="button" onclick="this.closest(&quot;.modal&quot;).remove()">Got it</button>
</div>
<script>
  window.__fixture = {};
  addEventListener('message', (event) => Object.assign(window.__fixture, event.data?.fixture));
</script>
</body>
</html>
