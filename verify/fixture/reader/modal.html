<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modal</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  .modal { position: fixed; left: 300px; top: 200px; width: 300px; height: 140px; padding: 16px; background: #fff; border: 1px solid #888; }
</style>
</head>
<body>
<button type="button">Background action</button>
<div class="modal" role="dialog" aria-modal="true" aria-label="Confirm">
  <p>Are you sure?</p>
  <button type="button">OK</button>
</div>
</body>
</html>
