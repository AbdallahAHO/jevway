<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select-all header</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  table { border-collapse: collapse; width: 800px; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #ddd; }
  /* A pointer on the select-all cell would make it look sortable; it is only a checkbox holder. */
  th.all { cursor: pointer; }
</style>
</head>
<body>
<table>
  <thead>
    <tr><th class="all"><input type="checkbox" aria-label="Select all"></th><th>Name</th></tr>
  </thead>
  <tbody>
    <tr><td></td><td>alpha</td></tr>
  </tbody>
</table>
</body>
</html>
