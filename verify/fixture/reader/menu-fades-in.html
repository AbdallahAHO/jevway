<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu fades in</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  /* A kit's popover: in the DOM and hidden until opened, then it waits a beat and fades in over a quarter of a second. */
  .menu { width: 160px; margin-top: 4px; border: 1px solid #bbb; opacity: 0; visibility: hidden; transition: opacity 250ms 100ms, visibility 0s 100ms; }
  .menu.open { opacity: 1; visibility: visible; }
  /* An endless animation elsewhere on the page must never hold up reading it. */
  .spinner { width: 20px; height: 20px; margin-top: 24px; border: 3px solid #bbb; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<button type="button" id="trigger" aria-haspopup="menu" aria-expanded="false">Panel menu</button>
<div class="menu" id="menu" role="menu">
  <button type="button" role="menuitem" id="view">View</button>
  <button type="button" role="menuitem">Edit</button>
  <button type="button" role="menuitem">Inspect</button>
</div>
<div class="spinner" aria-hidden="true"></div>
<script>
  window.__fixture = { viewed: false };
  const trigger = document.getElementById('trigger');
  trigger.addEventListener('click', () => {
    trigger.setAttribute('aria-expanded', 'true');
    document.getElementById('menu').classList.add('open');
  });
  document.getElementById('view').addEventListener('click', () => (window.__fixture.viewed = true));
</script>
</body>
</html>
