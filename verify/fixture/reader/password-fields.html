<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password fields</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  label { display: block; margin-top: 8px; }
  input { width: 240px; padding: 6px 8px; }
  button { margin-top: 12px; }
</style>
</head>
<body>
<form onsubmit="return false">
  <label for="user">Username</label>
  <input id="user" type="text">
  <label for="pw">Password</label>
  <input id="pw" type="password">
  <label for="pw2">Confirm password</label>
  <input id="pw2" type="password">
  <label for="old" style="display:none">Old password</label>
  <input id="old" type="password" style="display:none">
  <button type="submit">Sign in</button>
</form>
<script>
  // A person or the calling agent filled the first password field before the page was read.
  document.getElementById('pw').value = 'fixture-secret-9431';
</script>
</body>
</html>
