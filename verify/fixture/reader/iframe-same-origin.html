<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same-origin iframe</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  iframe { display: block; margin: 20px 0 0 120px; width: 360px; height: 200px; border: 3px solid #888; padding: 5px; }

</style>
</head>
<body>
<button type="button" onclick="window.__fixture.main = true">Main action</button>
<iframe src="frame-form.html" title="Coupon form"></iframe>
<script>
  window.__fixture = {};
  addEventListener('message', (event) => Object.assign(window.__fixture, event.data?.fixture));
</script>
</body>
</html>
