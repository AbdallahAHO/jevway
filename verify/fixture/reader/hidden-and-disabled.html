<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidden and disabled</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  button { display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<button type="button" aria-hidden="true">Hidden from assistive tech</button>
<button type="button" inert>Inert</button>
<button type="button" disabled>Disabled</button>
<button type="button">Normal</button>
</body>
</html>
