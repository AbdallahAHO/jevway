<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unnamed checkbox</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  table { border-collapse: collapse; width: 600px; }
  td { padding: 8px 10px; border-bottom: 1px solid #eee; }
  /* Radix-style checkbox: a button with role=checkbox and the default value "on", no text, no label. */
  button[role="checkbox"] { width: 16px; height: 16px; padding: 0; }
</style>
</head>
<body>
<table>
  <tbody>
    <tr>
      <td><button role="checkbox" aria-checked="false" value="on"></button></td>
      <td>Casa Flora</td>
    </tr>
  </tbody>
</table>
</body>
</html>
