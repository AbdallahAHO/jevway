<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidden checkbox label</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  .popup { position: absolute; top: 56px; left: 16px; width: 200px; background: #fff; border: 1px solid #bbb; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 0; }
  /* Grafana-style quick ranges: the input is invisible, the label is what a person sees and clicks. */
  input { opacity: 0; position: absolute; width: 0; height: 0; }
  label { display: block; padding: 8px 12px; cursor: pointer; }
</style>
</head>
<body>
<button type="button" aria-haspopup="dialog" aria-expanded="true">Time range</button>
<div class="popup" role="dialog" aria-label="Time range">
  <ul>
    <li><input type="checkbox" id="r1" name="Time ranges"><label for="r1">Last 24 hours</label></li>
    <li><input type="checkbox" id="r2" name="Time ranges"><label for="r2">Last 7 days</label></li>
    <li><input type="checkbox" id="r3" name="Time ranges"><label for="r3">Last 30 days</label></li>
    <li><input type="checkbox" id="r4" name="Time ranges"><label for="r4">Last 90 days</label></li>
  </ul>
</div>
<script>
  window.__fixture = { range: null };
  for (const label of document.querySelectorAll('label')) {
    label.addEventListener('click', () => (window.__fixture.range = label.textContent));
  }
</script>
</body>
</html>
