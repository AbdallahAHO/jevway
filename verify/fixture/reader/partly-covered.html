<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Partly covered</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  /* A phone alert list squeezes the Search field to about 54px, mostly its magnifier prefix. */
  .field { position: relative; width: 54px; height: 28px; }
  .field input { box-sizing: border-box; width: 54px; height: 28px; margin: 0; padding: 0; border: 1px solid #888; }
  /* The decorative prefix sits over the middle of the field, leaving its left edge and right third free. */
  .prefix { position: absolute; top: 0; left: 18px; width: 18px; height: 28px; background: #ddd; pointer-events: auto; }
</style>
</head>
<body>
<div class="field">
  <input aria-label="Search" type="text">
  <span class="prefix" aria-hidden="true"></span>
</div>
<script>
  window.__fixture = { value: null };
  document.querySelector('input').addEventListener('input', (event) => {
    window.__fixture.value = event.target.value;
  });
</script>
</body>
</html>
