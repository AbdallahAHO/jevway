<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply · Careers</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 14px 24px; background: #6d28d9; color: #fff; font-weight: 600; }
  main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
  .zone { display: grid; place-items: center; height: 160px; border: 2px dashed #6d28d9; border-radius: 10px; color: #6d28d9; }
  .zone.over { background: #f3e8ff; }
</style>
</head>
<body>
<header>Careers</header>
<main>
  <h1>Apply for Frontend Engineer</h1>
  <!-- A drop zone with no file input anywhere: only a dropped file gets in. -->
  <div class="zone" id="zone">Drag and drop your CV here</div>
  <p id="status">No CV attached yet</p>
</main>
<script>
  // Independent ground truth for verification; the agent never reads this object.
  window.__fixture = { dropped: null };
  const zone = document.getElementById('zone');
  zone.addEventListener('dragover', (event) => {
    event.preventDefault();
    zone.classList.add('over');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (event) => {
    event.preventDefault();
    zone.classList.remove('over');
    const file = event.dataTransfer.files[0];
    if (!file) return;
    window.__fixture.dropped = file.name;
    document.getElementById('status').textContent = `CV attached: ${file.name}`;
  });
</script>
</body>
</html>
