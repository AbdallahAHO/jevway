<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account · Settings</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 14px 24px; background: #7c2d12; color: #fff; font-weight: 600; }
  main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
  iframe { width: 100%; height: 200px; border: 1px solid #ddd; border-radius: 8px; }
</style>
</head>
<body>
<header>Account</header>
<main>
  <h1>Settings</h1>
  <p>Your profile is edited in the embedded form below.</p>
  <iframe title="Profile settings" src="__FRAME_ORIGIN__/settings-frame.html"></iframe>
</main>
<script>
  // Independent ground truth for verification; the agent never reads this object.
  window.__fixture = { saved: null };
  addEventListener('message', (event) => {
    if (typeof event.data?.saved === 'string') window.__fixture.saved = event.data.saved;
  });
</script>
</body>
</html>
