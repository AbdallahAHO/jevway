</main>
<script>
  // Independent ground truth for verification; the agent never reads this object.
  window.__fixture = { attached: null };
  addEventListener('message', (event) => {
    if (typeof event.data?.attached === 'string') window.__fixture.attached = event.data.attached;
  });
</script>
