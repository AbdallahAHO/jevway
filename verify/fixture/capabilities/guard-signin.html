<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Acme Cloud</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f3f4f6; }
  form, #home { max-width: 340px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 10px; }
  label { display: block; margin: 12px 0 4px; }
  input { padding: 6px 10px; width: 100%; box-sizing: border-box; }
  button { margin-top: 16px; width: 100%; padding: 8px; }
</style>
</head>
<body>
<form id="signin">
  <h1>Sign in</h1>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="off">
  <label for="password">Password</label>
  <input id="password" type="password">
  <button type="submit">Sign in</button>
  <p id="error" role="alert"></p>
</form>
<section id="home" hidden><h1>Welcome back, Ada</h1><p>You are signed in.</p></section>
<script>
  // Independent ground truth for verification; the agent never reads this object. The harness types the password.
  window.__fixture = { signedIn: false };
  document.getElementById('signin').addEventListener('submit', (event) => {
    event.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (email !== 'ada@example.com' || password !== 'correct horse') {
      document.getElementById('error').textContent = 'Wrong email or password.';
      return;
    }
    window.__fixture.signedIn = true;
    document.getElementById('signin').hidden = true;
    document.getElementById('home').hidden = false;
  });
</script>
</body>
</html>
